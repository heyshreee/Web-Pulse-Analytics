<body>
  <div id="root">
    <style>
      .app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0c0e14;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root:not(.dark) .app-preloader {
          background-color: #f8fafc;
          color: #0f172a;
        }
      }
      .preloader-emblem {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        margin-bottom: 16px;
        animation: pulsePreloader 1.8s ease-in-out infinite;
      }
      @keyframes pulsePreloader {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.88; }
      }
      .preloader-track {
        width: 140px;
        height: 4px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-top: 14px;
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 60px;
        background: #4f46e5;
        border-radius: 999px;
        animation: shimmerPreloader 1.2s infinite ease-in-out;
      }
      @keyframes shimmerPreloader {
        0% { transform: translateX(-60px); }
        100% { transform: translateX(140px); }
      }
    </style>
    <div class="app-preloader">
      <div class="preloader-emblem">
        <svg width="32" height="32" viewBox="0 0 706 204" fill="currentColor">
          <path d="M 43 102 L 43 147 L 89 147 L 90 145 L 89 102 Z" />
          <path d="M 1 61 L 1 98 L 39 98 L 39 61 Z" />
          <path d="M 705 121 L 705 93 L 609 92 L 581 127 L 526 2 L 496 2 L 415 128 L 347 52 L 298 52 L 214 138 L 114 21 L 46 21 L 200 203 L 231 202 L 325 111 L 406 203 L 426 203 L 510 66 L 564 191 L 582 191 L 621 122 Z" />
        </svg>
      </div>
      <div style="font-weight: 700; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px;">WebPulse <span style="font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); text-transform: uppercase;">Beta</span></div>
      <div class="preloader-track"><div class="preloader-bar"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
