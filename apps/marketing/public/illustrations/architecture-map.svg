<svg viewBox="0 0 1200 380" width="1200" height="380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amTitle">
  <title id="amTitle">How data flows through WebPulse: the tracker on your site captures events, the API validates the tracking ID and allowed origin, events are stored in your project database, and the dashboard reads aggregated queries</title>

  <defs>
    <marker id="amArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A78BFA" fill-opacity="0.75"/>
    </marker>
    <pattern id="amDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    .am-march { stroke-dasharray: 5 9; animation: amMarch 1.5s linear infinite; }
    @keyframes amMarch { to { stroke-dashoffset: -28; } }

    .am-travel { animation: amTravel 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    @keyframes amTravel {
      0%   { transform: translate(0, 0); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(var(--tx), 0); opacity: 0; }
    }
    .am-d1 { --tx: 30px; animation-delay: -0.1s; }
    .am-d2 { --tx: 30px; animation-delay: -0.9s; }
    .am-d3 { --tx: 30px; animation-delay: -1.5s; }

    .am-fade { animation: amFade 0.8s cubic-bezier(0.16, 0.84, 0.44, 1) both; }
    @keyframes amFade { from { opacity: 0; transform: translateY(10px); } }
    .am-s1 { animation-delay: 0.05s; }
    .am-s2 { animation-delay: 0.18s; }
    .am-s3 { animation-delay: 0.31s; }
    .am-s4 { animation-delay: 0.44s; }

    .am-pulse { transform-box: fill-box; transform-origin: center; animation: amPulse 2.6s ease-in-out infinite; }
    @keyframes amPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .am-march, .am-fade, .am-pulse { animation: none !important; }
      .am-travel { animation: none !important; opacity: 0 !important; }
    }
  </style>

  <rect width="1200" height="380" fill="url(#amDots)" opacity="0.6"/>

  <!-- 1 — your site, inside its allowed-origins boundary -->
  <g class="am-fade am-s1">
    <rect x="28" y="98" width="284" height="164" rx="22" stroke="#8B5CF6" stroke-opacity="0.34" stroke-dasharray="4 7"/>
    <rect x="40" y="84" width="146" height="22" rx="11" fill="#0C111C" stroke="#8B5CF6" stroke-opacity="0.34"/>
    <text x="52" y="99" font-size="9" font-weight="600" letter-spacing="1.6" fill="#A78BFA">ALLOWED ORIGINS</text>

    <rect x="40" y="110" width="260" height="140" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="64" y="128" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(76,140) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="M2 9h20"/>
      <path d="M6 6.5h.01M9.5 6.5h.01"/>
    </g>
    <text x="124" y="146" font-size="13" font-weight="600" fill="#E2E8F0">Your site</text>
    <text x="124" y="168" font-size="10.5" fill="#64748B">tracker script on your pages</text>
    <text x="124" y="186" font-size="10.5" fill="#64748B">page views · custom events</text>
  </g>

  <!-- 2 — WebPulse API -->
  <g class="am-fade am-s2">
    <rect x="352" y="110" width="250" height="140" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="376" y="128" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(388,140) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="20" height="7" rx="2"/>
      <rect x="2" y="13" width="20" height="7" rx="2"/>
      <path d="M6 7.5h.01M6 16.5h.01"/>
    </g>
    <text x="436" y="146" font-size="13" font-weight="600" fill="#E2E8F0">WebPulse API</text>
    <text x="436" y="168" font-size="10.5" fill="#64748B">checks tracking ID</text>
    <text x="436" y="186" font-size="10.5" fill="#64748B">and allowed origin</text>
    <circle cx="586" cy="124" r="4.5" fill="#48E6A1" class="am-pulse"/>
  </g>

  <!-- 3 — project database -->
  <g class="am-fade am-s3">
    <rect x="654" y="110" width="262" height="140" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="678" y="128" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(690,140) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
    </g>
    <text x="738" y="146" font-size="13" font-weight="600" fill="#E2E8F0">Project database</text>

    <rect x="678" y="172" width="101" height="26" rx="8" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.14"/>
    <text x="689" y="189" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">visitors</text>
    <rect x="791" y="172" width="101" height="26" rx="8" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.14"/>
    <text x="802" y="189" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">sessions</text>
    <rect x="678" y="206" width="101" height="26" rx="8" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.14"/>
    <text x="689" y="223" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">page_views</text>
    <rect x="791" y="206" width="101" height="26" rx="8" fill="#94A3B8" fill-opacity="0.08" stroke="#94A3B8" stroke-opacity="0.14"/>
    <text x="802" y="223" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">events</text>
  </g>

  <!-- 4 — dashboard -->
  <g class="am-fade am-s4">
    <rect x="968" y="110" width="188" height="140" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="1040" y="124" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(1052,136) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M3 20h18"/>
      <path d="M6 20V10M12 20V4M18 20v-7"/>
    </g>
    <text x="1062" y="192" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Dashboard</text>
    <text x="1062" y="212" font-size="10.5" fill="#64748B" text-anchor="middle">aggregated queries</text>
  </g>

  <!-- Arrows -->
  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#amArrow)">
    <line x1="300" y1="180" x2="346" y2="180" class="am-march"/>
    <line x1="602" y1="180" x2="648" y2="180" class="am-march"/>
    <line x1="916" y1="180" x2="962" y2="180" class="am-march"/>
  </g>
  <g fill="#48E6A1">
    <circle class="am-travel am-d1" cx="306" cy="180" r="3.2"/>
    <circle class="am-travel am-d2" cx="608" cy="180" r="3.2"/>
    <circle class="am-travel am-d3" cx="922" cy="180" r="3.2"/>
  </g>

  <!-- Stage captions -->
  <text x="40" y="290" font-size="9.5" font-weight="600" letter-spacing="2" fill="#475569">01 · CAPTURE</text>
  <text x="352" y="290" font-size="9.5" font-weight="600" letter-spacing="2" fill="#475569">02 · VALIDATE</text>
  <text x="654" y="290" font-size="9.5" font-weight="600" letter-spacing="2" fill="#475569">03 · STORE</text>
  <text x="968" y="290" font-size="9.5" font-weight="600" letter-spacing="2" fill="#475569">04 · READ</text>
</svg>
