<svg viewBox="0 0 780 500" width="780" height="500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ivTitle">
  <title id="ivTitle">Illustrative analytics panels: visitors with a period comparison, bounce rate, average session duration and custom event counts</title>

  <defs>
    <linearGradient id="ivArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ivBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="ivDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    .iv-fade { animation: ivFade 0.7s cubic-bezier(0.16, 0.84, 0.44, 1) both; }
    @keyframes ivFade { from { opacity: 0; transform: translateY(10px); } }
    .iv-f1 { animation-delay: 0.05s; }
    .iv-f2 { animation-delay: 0.15s; }
    .iv-f3 { animation-delay: 0.25s; }
    .iv-f4 { animation-delay: 0.35s; }

    .iv-draw {
      stroke-dasharray: 340;
      stroke-dashoffset: 340;
      animation: ivDraw 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }
    @keyframes ivDraw { to { stroke-dashoffset: 0; } }

    .iv-sweep {
      stroke-dasharray: 38 62;
      stroke-dashoffset: 38;
      animation: ivSweep 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }
    @keyframes ivSweep { to { stroke-dashoffset: 0; } }

    .iv-grow {
      transform-box: fill-box;
      transform-origin: left center;
      animation: ivGrow 1.1s cubic-bezier(0.16, 0.84, 0.44, 1) both;
    }
    @keyframes ivGrow { from { transform: scaleX(0); } }
    .iv-g1 { animation-delay: 0.35s; }
    .iv-g2 { animation-delay: 0.5s; }
    .iv-g3 { animation-delay: 0.65s; }
    .iv-g4 { animation-delay: 0.55s; }
    .iv-g5 { animation-delay: 0.7s; }
    .iv-g6 { animation-delay: 0.85s; }

    .iv-pulse { transform-box: fill-box; transform-origin: center; animation: ivPulse 2.4s ease-in-out infinite; }
    @keyframes ivPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .iv-fade, .iv-grow, .iv-pulse { animation: none !important; }
      .iv-draw, .iv-sweep { animation: none !important; stroke-dashoffset: 0 !important; }
    }
  </style>

  <rect width="780" height="500" fill="url(#ivDots)" opacity="0.65"/>

  <!-- Card A — visitors with period comparison -->
  <g class="iv-fade iv-f1">
    <rect x="40" y="40" width="340" height="196" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="68" y="74" font-size="13.5" font-weight="600" letter-spacing="2" fill="#64748B">VISITORS</text>
    <text x="352" y="74" font-size="12" letter-spacing="1.4" fill="#475569" text-anchor="end">SAMPLE DATA</text>
    <text x="68" y="124" font-size="38" font-weight="700" fill="#F1F5F9">24,183</text>
    <rect x="68" y="134" width="216" height="28" rx="14" fill="#48E6A1" fill-opacity="0.12" stroke="#48E6A1" stroke-opacity="0.3"/>
    <path d="M84 155l6.5-9 6.5 9z" fill="#48E6A1"/>
    <text x="104" y="153" font-size="13" fill="#48E6A1">12.4% vs previous period</text>

    <path d="M68 212H352" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="3 5"/>
    <path d="M68 190H352" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="3 5"/>
    <path d="M68 205 94 198 120 201 146 190 172 194 198 183 224 186 250 176 276 181 302 171 328 174 352 168 352 212 68 212Z" fill="url(#ivArea)"/>
    <path
      d="M68 205 94 198 120 201 146 190 172 194 198 183 224 186 250 176 276 181 302 171 328 174 352 168"
      stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="iv-draw"
    />
    <circle cx="352" cy="168" r="3.6" fill="#48E6A1" class="iv-pulse"/>
  </g>

  <!-- Card B — bounce rate -->
  <g class="iv-fade iv-f2">
    <rect x="400" y="40" width="340" height="196" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="428" y="74" font-size="13.5" font-weight="600" letter-spacing="2" fill="#64748B">BOUNCE RATE</text>

    <g transform="rotate(-90 474 152)">
      <circle cx="474" cy="152" r="46" stroke="#1E2536" stroke-width="11" pathLength="100"/>
      <circle cx="474" cy="152" r="46" stroke="#8B5CF6" stroke-width="11" stroke-linecap="round" pathLength="100" class="iv-sweep"/>
    </g>
    <text x="474" y="159" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="middle">38%</text>

    <text x="548" y="127" font-size="13.5" fill="#64748B">Sessions that ended</text>
    <text x="548" y="146" font-size="13.5" fill="#64748B">on the first page</text>
    <path d="M548 170l6.5-9 6.5 9z" fill="#48E6A1" transform="rotate(180 554.5 165.5)"/>
    <text x="568" y="169" font-size="12.5" fill="#48E6A1">41% previous period</text>

    <path d="M428 206h284" stroke="#94A3B8" stroke-opacity="0.12" stroke-dasharray="3 5"/>
  </g>

  <!-- Card C — average session -->
  <g class="iv-fade iv-f3">
    <rect x="40" y="256" width="340" height="196" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="68" y="290" font-size="13.5" font-weight="600" letter-spacing="2" fill="#64748B">AVG. SESSION</text>
    <text x="68" y="336" font-size="30" font-weight="700" fill="#F1F5F9">2m 41s</text>
    <text x="68" y="358" font-size="13" fill="#64748B">Average time spent per session</text>

    <rect x="68" y="378" width="284" height="10" rx="5" fill="#94A3B8" fill-opacity="0.14"/>
    <rect x="68" y="378" width="176" height="10" rx="5" fill="url(#ivBar)" class="iv-grow iv-g4"/>
    <text x="68" y="412" font-size="12.5" fill="#64748B">2m 18s previous period</text>
  </g>

  <!-- Card D — custom events -->
  <g class="iv-fade iv-f4">
    <rect x="400" y="256" width="340" height="196" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <text x="428" y="290" font-size="13.5" font-weight="600" letter-spacing="2" fill="#64748B">CUSTOM EVENTS</text>

    <text x="428" y="320" font-size="14.5" fill="#CBD5E1">click</text>
    <text x="712" y="320" font-size="13" fill="#94A3B8" text-anchor="end">3,918</text>
    <rect x="428" y="330" width="284" height="6" rx="3" fill="#94A3B8" fill-opacity="0.12"/>
    <rect x="428" y="330" width="239" height="6" rx="3" fill="#8B5CF6" class="iv-grow iv-g1"/>

    <text x="428" y="358" font-size="14.5" fill="#CBD5E1">signup</text>
    <text x="712" y="358" font-size="13" fill="#94A3B8" text-anchor="end">412</text>
    <rect x="428" y="368" width="284" height="6" rx="3" fill="#94A3B8" fill-opacity="0.12"/>
    <rect x="428" y="368" width="156" height="6" rx="3" fill="#A78BFA" class="iv-grow iv-g2"/>

    <text x="428" y="396" font-size="14.5" fill="#CBD5E1">purchase</text>
    <text x="712" y="396" font-size="13" fill="#94A3B8" text-anchor="end">228</text>
    <rect x="428" y="406" width="284" height="6" rx="3" fill="#94A3B8" fill-opacity="0.12"/>
    <rect x="428" y="406" width="86" height="6" rx="3" fill="#48E6A1" class="iv-grow iv-g3"/>
  </g>
</svg>
