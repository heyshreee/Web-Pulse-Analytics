<svg viewBox="0 0 440 760" width="440" height="760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ammTitle">
  <title id="ammTitle">How data flows through WebPulse: the tracker on your site captures events, the API validates the tracking ID and allowed origin, events are stored in your project database, and the dashboard reads aggregated queries</title>

  <defs>
    <marker id="ammArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A78BFA" fill-opacity="0.75"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    .amm-march { stroke-dasharray: 5 9; animation: ammMarch 1.5s linear infinite; }
    @keyframes ammMarch { to { stroke-dashoffset: -28; } }

    .amm-travel { animation: ammTravel 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    @keyframes ammTravel {
      0%   { transform: translate(0, 0); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(0, 42px); opacity: 0; }
    }
    .amm-d1 { animation-delay: -0.1s; }
    .amm-d2 { animation-delay: -0.9s; }
    .amm-d3 { animation-delay: -1.5s; }

    .amm-fade { animation: ammFade 0.8s cubic-bezier(0.16, 0.84, 0.44, 1) both; }
    @keyframes ammFade { from { opacity: 0; transform: translateY(10px); } }
    .amm-s1 { animation-delay: 0.05s; }
    .amm-s2 { animation-delay: 0.18s; }
    .amm-s3 { animation-delay: 0.31s; }
    .amm-s4 { animation-delay: 0.44s; }

    .amm-pulse { transform-box: fill-box; transform-origin: center; animation: ammPulse 2.6s ease-in-out infinite; }
    @keyframes ammPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .amm-march, .amm-fade, .amm-pulse { animation: none !important; }
      .amm-travel { animation: none !important; opacity: 0 !important; }
    }
  </style>

  <!-- 1 — your site inside its allowed-origins boundary -->
  <g class="amm-fade amm-s1">
    <rect x="30" y="22" width="128" height="24" rx="12" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.2"/>
    <text x="42" y="38" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">01 · CAPTURE</text>
    <rect x="168" y="22" width="170" height="24" rx="12" fill="#0C111C" stroke="#8B5CF6" stroke-opacity="0.34"/>
    <text x="180" y="38" font-size="11" font-weight="600" letter-spacing="1.6" fill="#A78BFA">ALLOWED ORIGINS</text>

    <rect x="18" y="48" width="404" height="128" rx="20" stroke="#8B5CF6" stroke-opacity="0.34" stroke-dasharray="4 7"/>
    <rect x="30" y="52" width="380" height="118" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>

    <rect x="52" y="74" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(64,86) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="M2 9h20"/>
      <path d="M6 6.5h.01M9.5 6.5h.01"/>
    </g>
    <text x="112" y="96" font-size="15" font-weight="600" fill="#E2E8F0">Your site</text>
    <text x="112" y="120" font-size="12.5" fill="#64748B">tracker script on your pages</text>
    <text x="112" y="140" font-size="12.5" fill="#64748B">page views · custom events</text>
  </g>

  <!-- connector -->
  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#ammArrow)">
    <line x1="220" y1="176" x2="220" y2="226" class="amm-march"/>
  </g>
  <g fill="#48E6A1">
    <circle class="amm-travel amm-d1" cx="220" cy="182" r="3.2"/>
  </g>

  <!-- 2 — WebPulse API -->
  <g class="amm-fade amm-s2">
    <rect x="30" y="202" width="148" height="24" rx="12" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.2"/>
    <text x="42" y="218" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">02 · VALIDATE</text>

    <rect x="30" y="232" width="380" height="118" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <circle cx="388" cy="246" r="4.5" fill="#48E6A1" class="amm-pulse"/>
    <rect x="52" y="254" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(64,266) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="20" height="7" rx="2"/>
      <rect x="2" y="13" width="20" height="7" rx="2"/>
      <path d="M6 7.5h.01M6 16.5h.01"/>
    </g>
    <text x="112" y="276" font-size="15" font-weight="600" fill="#E2E8F0">WebPulse API</text>
    <text x="112" y="300" font-size="12.5" fill="#64748B">checks tracking ID</text>
    <text x="112" y="320" font-size="12.5" fill="#64748B">and allowed origin</text>
  </g>

  <!-- connector -->
  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#ammArrow)">
    <line x1="220" y1="356" x2="220" y2="406" class="amm-march"/>
  </g>
  <g fill="#48E6A1">
    <circle class="amm-travel amm-d2" cx="220" cy="362" r="3.2"/>
  </g>

  <!-- 3 — project database -->
  <g class="amm-fade amm-s3">
    <rect x="30" y="382" width="128" height="24" rx="12" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.2"/>
    <text x="42" y="398" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">03 · STORE</text>

    <rect x="30" y="412" width="380" height="118" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="52" y="434" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(64,446) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
    </g>
    <text x="112" y="456" font-size="15" font-weight="600" fill="#E2E8F0">Project database</text>
    <text x="112" y="480" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">visitors, sessions,</text>
    <text x="112" y="500" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">page_views, events</text>
  </g>

  <!-- connector -->
  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#ammArrow)">
    <line x1="220" y1="536" x2="220" y2="586" class="amm-march"/>
  </g>
  <g fill="#48E6A1">
    <circle class="amm-travel amm-d3" cx="220" cy="542" r="3.2"/>
  </g>

  <!-- 4 — dashboard -->
  <g class="amm-fade amm-s4">
    <rect x="30" y="562" width="128" height="24" rx="12" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.2"/>
    <text x="42" y="578" font-size="11" font-weight="600" letter-spacing="2" fill="#64748B">04 · READ</text>

    <rect x="30" y="592" width="380" height="118" rx="18" fill="#0C111C" stroke="#94A3B8" stroke-opacity="0.16"/>
    <rect x="52" y="614" width="44" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.32"/>
    <g transform="translate(64,626) scale(0.8)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M3 20h18"/>
      <path d="M6 20V10M12 20V4M18 20v-7"/>
    </g>
    <text x="112" y="636" font-size="15" font-weight="600" fill="#E2E8F0">Dashboard</text>
    <text x="112" y="660" font-size="12.5" fill="#64748B">aggregated queries</text>
    <text x="112" y="680" font-size="12.5" fill="#64748B">read back per project</text>
  </g>
</svg>
