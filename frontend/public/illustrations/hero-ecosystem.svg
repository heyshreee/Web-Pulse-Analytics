<svg viewBox="0 0 720 720" width="720" height="720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heTitle">
  <title id="heTitle">A website, its tracker, events, storage, insights and audience all connected to one live WebPulse dashboard</title>

  <defs>
    <linearGradient id="heHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="heGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heDotsFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <pattern id="heDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.3" fill="#94A3B8" fill-opacity="0.14"/>
    </pattern>
    <mask id="heDotsMask" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="720">
      <rect width="720" height="720" fill="url(#heDotsFade)"/>
    </mask>
    <filter id="heBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <path id="heRingPath" d="M360 54 A306 306 0 1 1 359.9 54"/>
  </defs>

  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    .he-march { stroke-dasharray: 5 9; animation: heMarch 1.5s linear infinite; }
    @keyframes heMarch { to { stroke-dashoffset: -28; } }

    .he-travel { animation: heTravel 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    @keyframes heTravel {
      0%   { transform: translate(0, 0); opacity: 0; }
      12%  { opacity: 1; }
      84%  { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
    }

    .he-node { animation: heIn 0.9s cubic-bezier(0.16, 0.84, 0.44, 1) both; }
    @keyframes heIn { from { opacity: 0; transform: translateY(12px); } }

    .he-pulse { transform-box: fill-box; transform-origin: center; animation: hePulse 2.6s ease-in-out infinite; }
    @keyframes hePulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    .he-halo { transform-box: fill-box; transform-origin: center; animation: heHalo 3.2s ease-out infinite; }
    @keyframes heHalo {
      0%   { transform: scale(0.7); opacity: 0.5; }
      70%  { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .he-spin { transform-box: view-box; transform-origin: 360px 360px; animation: heSpin 26s linear infinite; }
    @keyframes heSpin { to { transform: rotate(360deg); } }

    .he-d1 { --tx: 0px;     --ty: -80px; animation-delay: -0.2s; }
    .he-d2 { --tx: 69.3px;  --ty: -40px; animation-delay: -1.1s; }
    .he-d3 { --tx: 69.3px;  --ty: 40px;  animation-delay: -2s; }
    .he-d4 { --tx: 0px;     --ty: 80px;  animation-delay: -1.6s; }
    .he-d5 { --tx: -69.3px; --ty: 40px;  animation-delay: -0.7s; }
    .he-d6 { --tx: -69.3px; --ty: -40px; animation-delay: -2.4s; }

    .he-n1 { animation-delay: 0.05s; }
    .he-n2 { animation-delay: 0.12s; }
    .he-n3 { animation-delay: 0.19s; }
    .he-n4 { animation-delay: 0.26s; }
    .he-n5 { animation-delay: 0.33s; }
    .he-n6 { animation-delay: 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .he-march, .he-node, .he-pulse, .he-halo, .he-spin { animation: none !important; }
      .he-travel { animation: none !important; opacity: 0 !important; }
    }
  </style>

  <!-- Dot texture, densest at the centre. -->
  <rect width="720" height="720" fill="url(#heDots)" mask="url(#heDotsMask)" opacity="0.85"/>

  <!-- Brand glow behind the hub. -->
  <circle cx="360" cy="360" r="306" fill="url(#heGlow)"/>

  <!-- Orbit caption: the phrase is repeated so the ring reads as one balanced
       circle instead of trailing off mid-arc. -->
  <text font-size="16" letter-spacing="5" fill="#64748B" opacity="0.85">
    <textPath href="#heRingPath" startOffset="0%">CAPTURE · STORE · UNDERSTAND · SHARE · CAPTURE · STORE · UNDERSTAND · SHARE</textPath>
  </text>

  <!-- Inner orbit, slowly rotating. -->
  <g class="he-spin" aria-hidden="true">
    <circle cx="360" cy="360" r="170" stroke="#A78BFA" stroke-opacity="0.22" stroke-dasharray="3 14"/>
  </g>

  <!-- Spokes: centre to centre, ends hidden behind the node and hub shapes. -->
  <g stroke="#A78BFA" stroke-opacity="0.42" stroke-width="1.4" aria-hidden="true">
    <line x1="360" y1="102" x2="360" y2="360" class="he-march"/>
    <line x1="583" y1="231" x2="360" y2="360" class="he-march"/>
    <line x1="583" y1="489" x2="360" y2="360" class="he-march"/>
    <line x1="360" y1="618" x2="360" y2="360" class="he-march"/>
    <line x1="137" y1="489" x2="360" y2="360" class="he-march"/>
    <line x1="137" y1="231" x2="360" y2="360" class="he-march"/>
  </g>

  <!-- Signals travelling along the spokes. -->
  <g fill="#48E6A1" aria-hidden="true">
    <circle class="he-travel he-d1" cx="360" cy="254" r="3.6"/>
    <circle class="he-travel he-d2" cx="452" cy="307" r="3.6"/>
    <circle class="he-travel he-d3" cx="452" cy="413" r="3.6"/>
    <circle class="he-travel he-d4" cx="360" cy="466" r="3.6"/>
    <circle class="he-travel he-d5" cx="268" cy="413" r="3.6"/>
    <circle class="he-travel he-d6" cx="268" cy="307" r="3.6"/>
  </g>

  <!-- Grounding shadow. -->
  <ellipse cx="360" cy="466" rx="118" ry="24" fill="#8B5CF6" opacity="0.22" filter="url(#heBlur)"/>

  <!-- Hub emblem. -->
  <g>
    <circle cx="360" cy="360" r="76" fill="url(#heHub)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="360" cy="360" r="64" stroke="#ffffff" stroke-opacity="0.14"/>
    <polyline
      points="314,364 338,364 348,338 360,392 372,350 382,364 406,364"
      stroke="#ffffff" stroke-opacity="0.94" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"
    />
  </g>
  <g>
    <circle cx="416" cy="304" r="10" fill="none" stroke="#48E6A1" stroke-opacity="0.5" class="he-halo"/>
    <circle cx="416" cy="304" r="5" fill="#48E6A1" class="he-pulse"/>
    <circle cx="416" cy="304" r="9" fill="none" stroke="#48E6A1" stroke-opacity="0.35"/>
  </g>

  <!-- Satellites: icon above label, sized so the labels stay readable on phones. -->
  <g class="he-node he-n1">
    <rect x="290" y="69" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(351,81) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="M2 9h20"/>
      <path d="M6 6.5h.01M9.5 6.5h.01"/>
    </g>
    <text x="360" y="123" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Your site</text>
  </g>

  <g class="he-node he-n2">
    <rect x="513" y="198" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(574,210) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/>
    </g>
    <text x="583" y="252" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Tracker</text>
  </g>

  <g class="he-node he-n3">
    <rect x="513" y="456" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(574,468) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18"/>
    </g>
    <text x="583" y="510" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Events</text>
  </g>

  <g class="he-node he-n4">
    <rect x="290" y="585" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(351,597) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
    </g>
    <text x="360" y="639" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Storage</text>
  </g>

  <g class="he-node he-n5">
    <rect x="67" y="456" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(128,468) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M3 20h18"/>
      <path d="M6 20V10M12 20V4M18 20v-7"/>
    </g>
    <text x="137" y="510" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Insights</text>
  </g>

  <g class="he-node he-n6">
    <rect x="67" y="198" width="140" height="66" rx="16" fill="#101522" stroke="#94A3B8" stroke-opacity="0.2"/>
    <g transform="translate(128,210) scale(0.72)" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18"/>
      <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/>
    </g>
    <text x="137" y="252" font-size="19" font-weight="500" fill="#CBD5E1" text-anchor="middle">Audience</text>
  </g>
</svg>
