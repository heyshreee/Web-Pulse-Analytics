<svg viewBox="0 0 420 120" width="420" height="120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pmTitle">
  <title id="pmTitle">A compact pipeline mark: a website, stored events and an insights chart</title>

  <defs>
    <marker id="pmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#A78BFA" fill-opacity="0.7"/>
    </marker>
  </defs>

  <style>
    .pm-march { stroke-dasharray: 4 8; animation: pmMarch 1.6s linear infinite; }
    @keyframes pmMarch { to { stroke-dashoffset: -24; } }

    .pm-travel { animation: pmTravel 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    @keyframes pmTravel {
      0%   { transform: translate(0, 0); opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translate(56px, 0); opacity: 0; }
    }
    .pm-d1 { animation-delay: -0.2s; }
    .pm-d2 { animation-delay: -1.3s; }

    .pm-pulse { transform-box: fill-box; transform-origin: center; animation: pmPulse 2.6s ease-in-out infinite; }
    @keyframes pmPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .pm-march, .pm-pulse { animation: none !important; }
      .pm-travel { animation: none !important; opacity: 0 !important; }
    }
  </style>

  <g stroke="#8B5CF6" stroke-opacity="0.32" fill="#101522">
    <rect x="40" y="28" width="64" height="64" rx="18"/>
    <rect x="178" y="28" width="64" height="64" rx="18"/>
    <rect x="316" y="28" width="64" height="64" rx="18"/>
  </g>

  <g stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="translate(60,48) scale(0.8)">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="M2 9h20"/>
    </g>
    <g transform="translate(198,48) scale(0.8)">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
      <path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
    </g>
    <g transform="translate(336,48) scale(0.8)">
      <path d="M3 20h18"/>
      <path d="M6 20V10M12 20V4M18 20v-7"/>
    </g>
  </g>

  <circle cx="362" cy="34" r="4" fill="#48E6A1" class="pm-pulse"/>

  <g stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.4" marker-end="url(#pmArrow)">
    <line x1="104" y1="60" x2="174" y2="60" class="pm-march"/>
    <line x1="242" y1="60" x2="312" y2="60" class="pm-march"/>
  </g>
  <g fill="#48E6A1">
    <circle class="pm-travel pm-d1" cx="108" cy="60" r="3"/>
    <circle class="pm-travel pm-d2" cx="246" cy="60" r="3"/>
  </g>
</svg>
