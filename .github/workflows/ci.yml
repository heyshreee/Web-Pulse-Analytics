name: CI

on:
  push:
    branches: [main, development, v1, v1-dev, v2, v2-dev, chore/monorepo-restructure]
  pull_request:
    branches: [main, development, v1, v1-dev, v2, v2-dev, chore/monorepo-restructure]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  marketing:
    name: Marketing (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing/dist
          retention-days: 7
          if-no-files-found: error

  v1:
    name: V1 Dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-dist
          path: apps/v1/dist
          retention-days: 7
          if-no-files-found: error

  v2:
    name: V2 Dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-dist
          path: apps/v2/dist
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend (install + syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: node ../scripts/check-syntax.mjs src

      - name: Run tests
        run: npm test

  repo:
    name: Repository hygiene (migrations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration files (no SQL executed)
        run: node scripts/check-migrations.mjs

  ci:
    name: CI
    needs: [marketing, v1, v2, backend, repo]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        run: echo "Marketing, V1, V2, backend, and migration hygiene checks passed."
