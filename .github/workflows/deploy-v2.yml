name: Deploy V2 Beta Dashboard

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment (development or beta)'
        required: true
        type: string
      dry_run:
        description: 'Validate build and configuration without invoking deployment provider'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target GitHub Environment'
        required: true
        type: choice
        options:
          - development
          - beta
        default: 'beta'
      dry_run:
        description: 'Validate build and configuration without invoking deployment provider'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-v2-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Environment Guard
    runs-on: ubuntu-latest
    steps:
      - name: Guard Environment
        run: |
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "::error::V2 Dashboard is strictly a Beta product and must NEVER be deployed to the 'production' environment! The stable production dashboard is V1."
            exit 1
          fi
          if [ "$ENV" != "development" ] && [ "$ENV" != "beta" ]; then
            echo "::error::Invalid deployment environment: '$ENV'. Allowed environments for V2 Beta are 'development' and 'beta'."
            exit 1
          fi
          echo "Environment '$ENV' validated for V2 Beta Dashboard deployment."

  build:
    name: Build V2 Beta Dashboard
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.checksum.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/v2/package-lock.json

      - name: Install dependencies
        working-directory: apps/v2
        run: npm ci

      - name: Lint
        working-directory: apps/v2
        run: npm run lint

      - name: Build
        working-directory: apps/v2
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ inputs.environment == 'beta' && 'https://api.webpulseanalytics.tech/api' || 'http://localhost:3000/api' }}
          VITE_MARKETING_URL: ${{ inputs.environment == 'beta' && 'https://webpulseanalytics.tech' || 'http://localhost:5174' }}
          VITE_V1_APP_URL: ${{ inputs.environment == 'beta' && 'https://app.webpulseanalytics.tech' || 'http://localhost:5173' }}
          VITE_SOCKET_URL: ${{ inputs.environment == 'beta' && 'https://api.webpulseanalytics.tech' || 'http://localhost:3000' }}
        run: npm run build

      - name: Compute artifact checksum
        id: checksum
        working-directory: apps/v2/dist
        run: |
          DIGEST=$(find . -type f -exec sha256sum {} + | sort | sha256sum | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "V2 build artifact digest: $DIGEST"

      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: v2-dist-${{ inputs.environment }}-${{ github.sha }}
          path: apps/v2/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy V2 Beta Dashboard (${{ inputs.environment }})
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            apps/v2/vercel.json
            apps/v2/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: v2-dist-${{ inputs.environment }}-${{ github.sha }}
          path: apps/v2/dist

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Execute Deployment
        id: provider_deploy
        working-directory: apps/v2
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V2 || secrets.VERCEL_PROJECT_ID }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "status=dry_run" >> "$GITHUB_OUTPUT"
            echo "url=https://beta.webpulseanalytics.tech (dry-run)" >> "$GITHUB_OUTPUT"
            echo "Dry-run validation successful. Provider deployment skipped."
            exit 0
          fi

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel deployment credentials (VERCEL_TOKEN and VERCEL_PROJECT_ID_V2) are not configured in GitHub Environment '$TARGET_ENV'."
            echo "status=pending_configuration" >> "$GITHUB_OUTPUT"
            echo "url=https://beta.webpulseanalytics.tech (existing deployment untouched)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Preparing prebuilt distribution with SPA routing configuration..."
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json
          ln -s . apps/v2 2>/dev/null || true

          VERCEL_ARGS=("--yes" "--token=$VERCEL_TOKEN")
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            VERCEL_ARGS+=("--project=$VERCEL_PROJECT_ID")
          fi
          if [ -n "$VERCEL_ORG_ID" ]; then
            VERCEL_ARGS+=("--scope=$VERCEL_ORG_ID")
          fi
          if [ "$TARGET_ENV" = "beta" ]; then
            VERCEL_ARGS+=("--prod")
          fi

          echo "Deploying V2 Beta Dashboard prebuilt artifact to Vercel ($TARGET_ENV)..."
          if DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt "${VERCEL_ARGS[@]}"); then
            echo "Prebuilt deployment succeeded: $DEPLOY_URL"
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel prebuilt deployment encountered an issue for $TARGET_ENV. Check project Root Directory settings on Vercel dashboard."
            echo "status=pending_configuration" >> "$GITHUB_OUTPUT"
            echo "url=https://beta.webpulseanalytics.tech (existing deployment untouched)" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Deployment Summary
        if: always()
        run: |
          TARGET_DOMAIN="${{ inputs.environment == 'beta' && 'https://beta.webpulseanalytics.tech' || 'Preview Environment' }}"
          STATUS="${{ steps.provider_deploy.outputs.status || (inputs.dry_run && 'Dry Run (Verified)' || 'Pending Configuration') }}"
          URL="${{ steps.provider_deploy.outputs.url || 'https://beta.webpulseanalytics.tech' }}"

          echo "### 🧪 V2 Beta Dashboard Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Application** | V2 Beta Dashboard (\`apps/v2\` - Beta Preview) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **GitHub Environment** | \`${{ inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Domain** | $TARGET_DOMAIN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact Digest** | \`${{ needs.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deployment Status** | **$STATUS** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deployment URL** | $URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "pending_configuration" ]; then
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Vercel deployment credentials (\`VERCEL_TOKEN\` and \`VERCEL_PROJECT_ID_V2\`) are not yet configured in GitHub Environment \`${{ inputs.environment }}\`. The build artifacts were successfully validated and the existing deployment was left unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
