name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release (frontend lint + build)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Package frontend build artifact
        run: tar -czf "webpulse-frontend-${GITHUB_REF_NAME}.tar.gz" -C frontend dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: webpulse-frontend-*.tar.gz
          # NOTE: creating a release never deploys database migrations.
          # Migrations under supabase/ must be applied through a reviewed,
          # manual process (see docs/deployment.md).
