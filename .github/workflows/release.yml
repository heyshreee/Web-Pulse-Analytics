name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Marketing
        working-directory: apps/marketing
        run: |
          npm ci
          npm run build

      - name: Build V1 Dashboard
        working-directory: apps/v1
        run: |
          npm ci
          npm run build

      - name: Build V2 Dashboard
        working-directory: apps/v2
        run: |
          npm ci
          npm run build

      - name: Package build artifacts
        run: |
          tar -czf "webpulse-marketing-${GITHUB_REF_NAME}.tar.gz" -C apps/marketing dist
          tar -czf "webpulse-v1-${GITHUB_REF_NAME}.tar.gz" -C apps/v1 dist
          tar -czf "webpulse-v2-${GITHUB_REF_NAME}.tar.gz" -C apps/v2 dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: webpulse-*.tar.gz
          # NOTE: creating a release never deploys database migrations.
          # Migrations under supabase/ must be applied through a reviewed,
          # manual process (see docs/deployment.md).
