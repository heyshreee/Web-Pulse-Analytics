version: 2
updates:
  # Marketing website (React + Vite)
  - package-ecosystem: npm
    directory: /apps/marketing
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - marketing
    commit-message:
      prefix: 'chore(deps)'
    groups:
      marketing-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # V1 dashboard (React + Vite)
  - package-ecosystem: npm
    directory: /apps/v1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - v1
    commit-message:
      prefix: 'chore(deps)'
    groups:
      v1-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # V2 dashboard (React + Vite)
  - package-ecosystem: npm
    directory: /apps/v2
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - v2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      v2-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Backend (Express + Socket.IO)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: 'chore(deps)'
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
