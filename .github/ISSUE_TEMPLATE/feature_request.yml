name: Feature request
description: Suggest an idea or improvement for Web Pulse Analytics
title: '[Feature]: '
labels: ['feature', 'needs-triage']
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and discussions; this is not a duplicate.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - V1 dashboard (apps/v1)
        - V2 dashboard (apps/v2)
        - Marketing / docs site
        - Backend API
        - Tracking script
        - Real-time (Socket.IO)
        - Database / Supabase
        - Billing / plans
        - Tooling / CI
        - Other
    validations:
      required: true

  - type: dropdown
    id: release-line
    attributes:
      label: Release line
      description: Keep V1 and V2 isolated; shared tooling goes to development.
      options:
        - V1 (v1 / v1-dev)
        - V2 (v2 / v2-dev)
        - Shared / tooling (development)
        - Unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Why is it valuable?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or design you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, related issues.
    validations:
      required: false
