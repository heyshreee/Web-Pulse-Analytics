name: Bug report
description: Report a reproducible defect in Web Pulse Analytics
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Web Pulse Analytics better.

        ⚠️ **Do not report security vulnerabilities here.** Use the private process in
        [SECURITY.md](https://github.com/heyshreee/Web-Pulse-Analytics/blob/development/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard UI
        - Marketing / docs site
        - Tracking script
        - API
        - Real-time (Socket.IO)
        - Database / Supabase
        - Billing / plans
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the exact error text if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list that reliably reproduces the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste console / server logs. **Redact secrets, tokens, API keys,
        and any real visitor data before submitting.**
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA where you saw this.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, deployment target.
      placeholder: 'e.g. Windows 11, Chrome 130, Node 22, local dev'
    validations:
      required: false
